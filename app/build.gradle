plugins { id 'com.android.application' }

android {
    namespace 'com.example.voxelpe'
    compileSdk 34
    defaultConfig {
        applicationId 'com.example.voxelpe'
        minSdk 8
        targetSdk 8
        versionCode 2
        versionName '0.2.0'
        // No native .so libraries are used by this prototype. The Java/Dalvik
        // build is therefore ABI-neutral and is not restricted to one ARM ABI.
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_7
        targetCompatibility JavaVersion.VERSION_1_7
    }
}
